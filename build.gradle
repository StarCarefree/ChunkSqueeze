buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { chunksqueeze { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('validation/runtime')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java.srcDir 'src/gametest/java'
sourceSets.main.resources.srcDirs 'src/generated/resources', 'src/gametest/resources'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

mixin {
    add sourceSets.main, 'chunksqueeze.refmap.json'
    config 'chunksqueeze.mixins.json'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    maxHeapSize = '2G'
}

def metadata = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                mod_description: mod_description]
tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('META-INF/mods.toml') { expand metadata }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    exclude 'cn/star/chunksqueeze/gametest/**'
    exclude 'data/chunksqueeze/structures/empty.nbt'
    manifest { attributes 'MixinConfigs': 'chunksqueeze.mixins.json' }
    finalizedBy 'reobfJar'
}

tasks.register('verifyBackgroundSamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.storage.BackgroundSampleVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    jvmArgs '-Xms2G', '-Xmx4G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').get(), providers.gradleProperty('backgroundOutput').get()
}

tasks.register('verifyCompactExport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.codec.CompactExportVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('compactSource').get(), providers.gradleProperty('restored').get()
}

tasks.register('releaseBundle', Zip) {
    dependsOn tasks.named('reobfJar')
    archiveFileName = "ChunkSqueeze-Forge-${minecraft_version}-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar'))
    from('README.md', 'README_CN.md', 'LICENSE')
    from('doc') { into 'doc' }
    from(['tools/restore_world.py', 'tools/compact_world.py', 'tools/compact_region.py']) { into 'tools' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn 'releaseBundle' }
