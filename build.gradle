plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('validation/runtime')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.java.srcDir 'src/gametest/java'
sourceSets.main.resources { srcDirs 'src/generated/resources', 'src/gametest/resources' }
tasks.named('jar', Jar) {
    from('LICENSE')
    exclude 'cn/star/chunksqueeze/gametest/**'
    exclude 'data/chunksqueeze/structure/empty.nbt'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets {
    genbench {
        compileClasspath += sourceSets.main.compileClasspath
    }
    atmtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('generationBenchmarkJar', Jar) {
    dependsOn tasks.named('genbenchClasses')
    archiveFileName = 'chunksqueeze-generation-benchmark.jar'
    destinationDirectory = layout.buildDirectory.dir('validation')
    from sourceSets.genbench.output
    from('LICENSE')
}

tasks.register('benchmarkSaves', JavaExec) {
    dependsOn testClasses
    def baseline = providers.gradleProperty('saveBaseline')
    classpath = (baseline.isPresent() ? files(baseline.get()) : files()) + sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.benchmark.SaveBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms2G', '-Xmx2G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    systemProperty 'chunksqueeze.benchmark.deferred', providers.gradleProperty('saveDeferred').getOrElse('false')
    def recording = providers.gradleProperty('saveJfr')
    if (recording.isPresent()) jvmArgs "-XX:StartFlightRecording=filename=${recording.get()},settings=profile,dumponexit=true"
    args providers.gradleProperty('saveInput').get(), providers.gradleProperty('saveOutput').get(),
            providers.gradleProperty('saveFork').getOrElse('0')
}

tasks.register('atmValidationJar', Jar) {
    dependsOn tasks.named('atmtestClasses')
    archiveFileName = 'chunksqueeze-atm-validation.jar'
    destinationDirectory = layout.buildDirectory.dir('validation')
    from sourceSets.atmtest.output
    from('LICENSE')
}


dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('verifySamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.codec.SampleVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').getOrElse('validation/input'),
            providers.gradleProperty('sampleOutput').getOrElse('validation/results'),
            providers.gradleProperty('sampleLimit').getOrElse('0')
}

tasks.register('verifyRestored', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.codec.RestoredVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').getOrElse('validation/input'),
            providers.gradleProperty('restored').getOrElse('validation/restored')
}

tasks.register('verifyCompactExport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.codec.CompactExportVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('compactSource').get(), providers.gradleProperty('restored').get()
}

tasks.register('verifyCompactSamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.codec.CompactSampleVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').getOrElse('validation/input'),
            providers.gradleProperty('compactImported').getOrElse('validation/compact/imported'),
            providers.gradleProperty('compactOutput').getOrElse('validation/compact/reencoded')
}

tasks.register('verifyBackgroundSamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.storage.BackgroundSampleVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms2G', '-Xmx4G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').get(), providers.gradleProperty('backgroundOutput').get()
}

tasks.register('verifyMigrationSamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.migration.MigrationSampleVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('samples').getOrElse('validation/input'),
            providers.gradleProperty('migrationOutput').getOrElse('validation/migration')
}

tasks.register('benchmarkMigration', JavaExec) {
    dependsOn testClasses
    def baseline = providers.gradleProperty('migrationBaseline')
    classpath = (baseline.isPresent() ? files(baseline.get()) : files()) + sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.migration.MigrationBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms6G', '-Xmx6G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('migrationInput').getOrElse('validation/nether-input'),
            providers.gradleProperty('migrationOutput').getOrElse('validation/migration-benchmark/run'),
            providers.gradleProperty('migrationWorkers').getOrElse('1'),
            providers.gradleProperty('migrationLimit').getOrElse('20'),
            providers.gradleProperty('migrationLabel').getOrElse('current')
}

tasks.register('benchmarkReadChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.benchmark.CheckOverheadProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms2G', '-Xmx2G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('loadRoot').getOrElse('validation/load-benchmark/input'),
            providers.gradleProperty('checkOutput').getOrElse('validation/load-benchmark/check-overhead.json')
}

tasks.register('benchmarkLoads', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.star.chunksqueeze.benchmark.LoadBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms2G', '-Xmx2G', '-XX:+UseG1GC', '-Dfile.encoding=UTF-8'
    args providers.gradleProperty('loadInput').getOrElse('validation/load-benchmark/input/overworld'),
            providers.gradleProperty('loadOutput').getOrElse('validation/load-benchmark/results/overworld-0.json'),
            providers.gradleProperty('loadRounds').getOrElse('3'),
            providers.gradleProperty('loadFork').getOrElse('0'),
            providers.gradleProperty('loadRegionLimit').getOrElse('0')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

def releaseBundle = tasks.register('releaseBundle', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = "ChunkSqueeze-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar'))
    from('README.md', 'README_CN.md', 'LICENSE')
    from('doc') { into 'doc' }
    from(['tools/restore_world.py', 'tools/compact_world.py', 'tools/compact_region.py']) { into 'tools' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn releaseBundle }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
